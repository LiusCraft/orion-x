# 仅在 Go 相关文件变更时运行；前端、文档、skills 等变更不触发。
name: Go CI

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .golangci.yml
      - .github/workflows/go-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .golangci.yml
      - .github/workflows/go-ci.yml

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # store 里有一个需要真实 Postgres 的 sync 测试（外键/删除顺序，DryRun 造不出来）。
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev \
            libopus-dev libopusfile-dev

      - name: install onnxruntime
        run: |
          curl -sSL https://github.com/microsoft/onnxruntime/releases/download/\
          v1.22.0/onnxruntime-linux-x64-1.22.0.tgz -o onnxruntime.tgz
          tar xzf onnxruntime.tgz
          echo "CGO_CFLAGS=-I$(pwd)/onnxruntime-linux-x64-1.22.0/include" \
            >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$(pwd)/onnxruntime-linux-x64-1.22.0/lib \
            -lonnxruntime" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(pwd)/onnxruntime-linux-x64-1.22.0/lib" \
            >> $GITHUB_ENV

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: go test
        run: go test -race -count=1 ./...

      - name: go test (postgres-backed store tests)
        env:
          ORION_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./internal/store
