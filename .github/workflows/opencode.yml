# 评论触发：包含 /oc 或 /opencode 的评论会启动 opencode 智能体，
# 可解释 issue、审查指定代码，也可以按指令修改代码并提交到分支或 PR。
# 需要仓库 secret OPENCODE_API_KEY；仅响应有写权限成员的评论。
# GITHUB_TOKEN 建 PR 需要仓库开启 Settings → Actions → General → Allow GitHub Actions to create and approve pull requests；
# 未开启时改动类任务会在收尾建 PR 时失败（分支已推送，见运行日志）。
# 运行期间维护一条状态评论（原地更新、结束收尾为最终结论，多次运行复用同一条），见 .github/opencode-instructions.md 与 .github/opencode-progress-comment.sh。
# 在途的 opencode 会用 👍 接管新的 /oc 评论，本工作流识别后跳过重复运行。
# 注意：用 GITHUB_TOKEN 推送的提交不会触发其它 workflow，需要手动 re-run 或评论 /oc review。
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 使用仓库内置 GITHUB_TOKEN（无需安装 GitHub App），权限按最小需要声明。
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # 仅响应有写权限成员的评论；忽略机器人自身的评论，避免循环触发。
    if: |
      !endsWith(github.event.comment.user.login, '[bot]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 在途的 opencode 运行发现新的 /oc 评论后会加 👍 接管；已接管的评论不再重复运行。
      - name: Skip if handled by an in-flight run
        id: handled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            endpoint="pulls/comments/${{ github.event.comment.id }}/reactions"
          else
            endpoint="issues/comments/${{ github.event.comment.id }}/reactions"
          fi
          count=$(gh api "repos/${{ github.repository }}/$endpoint" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and .content == "+1")] | length')
          if [ "$count" -gt 0 ]; then
            echo "::notice::该评论已被在途的 opencode 运行接管，跳过重复运行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # 状态评论：复用本 issue/PR 上已有的 opencode 状态评论（首行标记定位），没有才新建；由智能体原地更新并收尾为最终结论。
      - name: Create or reuse progress comment
        id: progress
        if: steps.handled.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/opencode-progress-comment.sh create "${{ github.event.issue.number || github.event.pull_request.number }}" "⏳ opencode 正在处理…" >> "$GITHUB_OUTPUT"

      # 以全局 AGENTS.md 形式注入本次运行的约定（状态评论、会话分享、安全边界），不改动仓库文件。
      - name: Prepare opencode run instructions
        if: steps.handled.outputs.skip != 'true'
        run: |
          config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          mkdir -p "$config_dir"
          cp .github/opencode-instructions.md "$config_dir/AGENTS.md"
          # 全局配置（V1 permission 写法，适配 v1.18.x；升级 opencode 时需同步核对）：
          # CI 无人应答权限确认（ask == 永久挂起），放行默认会 ask 的权限并禁用交互式提问工具。
          cp .github/opencode-ci.json "$config_dir/opencode.json"

      # GITHUB_TOKEN 模式下 opencode 不会配置 git 身份，这里预先配置，保证 /oc 修复类指令能提交。
      - name: Configure git identity
        if: steps.handled.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: anomalyco/opencode/github@latest
        if: steps.handled.outputs.skip != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PROGRESS_COMMENT_ID: ${{ steps.progress.outputs.id }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
          use_github_token: true

      # 收尾兜底：智能体已收尾（状态行不再是 ⏳）则不动；否则保留评论内容，仅标记为未收尾。
      - name: Finalize progress comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROGRESS_COMMENT_ID: ${{ steps.progress.outputs.id }}
        run: bash .github/opencode-progress-comment.sh finalize
