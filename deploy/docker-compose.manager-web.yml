services:
  manager-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orion_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MANAGER_DB_PASSWORD:-postgres}
    volumes:
      - manager_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orion_manager"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    restart: unless-stopped

  manager:
    build:
      context: ..
      dockerfile: Dockerfile.manager
    depends_on:
      manager-db:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MANAGER_SERVER_ADDRESS: 0.0.0.0:8081
      MANAGER_DB_DSN: host=manager-db user=postgres password=${MANAGER_DB_PASSWORD:-postgres} dbname=orion_manager port=5432 sslmode=disable TimeZone=UTC
      MANAGER_ACCESS_KEY_CIPHER_SECRET: ${MANAGER_ACCESS_KEY_CIPHER_SECRET}
      MANAGER_AUTH_JWT_SECRET: ${MANAGER_AUTH_JWT_SECRET}
      MANAGER_AUTH_ISSUER: ${MANAGER_AUTH_ISSUER:-orion-x-manager}
      MANAGER_AUTH_ACCESS_TOKEN_TTL_SECONDS: ${MANAGER_AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      MANAGER_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${MANAGER_AUTH_REFRESH_TOKEN_TTL_SECONDS:-1209600}
    ports:
      - "127.0.0.1:${MANAGER_BIND_PORT:-18081}:8081"
    restart: unless-stopped

  web:
    build:
      context: ../web-ui
      dockerfile: Dockerfile
      args:
        VITE_MANAGER_API_BASE_URL: ""
    depends_on:
      - manager
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-18080}:80"
    restart: unless-stopped

volumes:
  manager_db_data:
