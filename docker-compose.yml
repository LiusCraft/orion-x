services:
  postgres:
    image: postgres:16-alpine
    container_name: orionx-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion123
      POSTGRES_DB: orionx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orionx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
