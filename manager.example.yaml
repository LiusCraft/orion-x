server:
  addr: ":9090"

database:
  dsn: "postgres://orion:orion123@localhost:5432/orionx?sslmode=disable"

jwt:
  secret: "change-me-in-production"

admin:
  username: "admin"
  password: "admin123"   # 仅首次启动时创建用户，之后此字段可删除

github_oauth:
  client_id: ""           # GitHub OAuth App Client ID
  client_secret: ""        # GitHub OAuth App Client Secret
  redirect_url: ""         # GitHub OAuth 回调地址（后端接口），必须与 GitHub App 设置一致
                            # 本地开发: http://localhost:9090/api/auth/github/callback
                            # 生产环境: https://yourdomain.com/api/auth/github/callback
                            # 回调后跳回前端的地址由前端通过 ?from= 参数自报，无需配置

logging:
  level: "info"
  format: "console"    # console | json

# 对象存储：资源（音色参考音频 / 图片 / 知识库文档原件）的上传与签名访问。
# 走 S3 协议，可对接七牛云 Kodo、AWS S3、MinIO、阿里云 OSS 等；不需要时整段删除
# （资源接口返回 503，其余功能不受影响）。
storage:
  type: "s3"
  endpoint: "https://s3.cn-east-1.qiniucs.com"   # 七牛 Kodo 华东-浙江；区域对照见七牛《服务域名》
  region: "cn-east-1"                            # 必须与 endpoint 的区域一致（参与签名）
  bucket: "your-bucket"                          # 七牛填「S3 空间名」，见空间概览（可能不同于七牛空间名）
  access_key: ""                                 # 建议留空，改用环境变量
  secret_key: ""                                 # STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY
  use_path_style: true                           # 七牛 / MinIO 建议 true；AWS S3 可设为 false
  prefix: ""                                     # 可选 key 前缀，多环境共用一个桶时用 dev/prod
  presign_ttl: "15m"                             # 预签名 URL 有效期（列表、预览、下载都走它）
  max_upload_size: 52428800                      # 单文件上限 50MB（按用途还有更小的限制）

# 服务间调用的共享 token（wsserver → manager 的 /internal/billing/*）。
# 建议只走环境变量 INTERNAL_TOKEN，不落配置文件。
#
# 留空 = /internal/billing/* **拒绝一切请求**（不是“不鉴权”）：忘了配如果等于放行，
# 那迟早会发生在生产上。存量 /internal/* 接口暂不受它影响。
internal:
  token: ""

# 计费（控制面）。整段可以删掉：不写就是启用，用 service 的默认参数跑；
# 只有显式写 enabled: false 才算关闭（关闭后 /api/billing/* 返回 503，结算 worker
# 也不启动，内部接口不注册）。
# billing:
#   enabled: true                   # nil = 启用；显式 false 关闭
#   currency: "CNY"                 # 单币种部署，P1 不做汇率
#   reserve_seconds: 600            # 会话预冻结覆盖的时长，也是下发给数据面的 max_session_seconds
#   reserve_rate_micro: 0           # 每秒预留额（微元）；0 = 按 duration 类计费项的单价估算
#   settlement_mode: "async"        # sync | async（P1 默认 async）
#   overdraft_policy: "deny"        # deny = 余额扣负就停服；allow = 挂账
#   period_timezone: "Asia/Shanghai"  # 账期（自然月）的时区，默认 UTC
#   signup_grant_micro: 5000000     # 新账户注册赠款总额（微元，5000000 = ￥5），按计费项均分

# 充值（支付渠道 → 余额）。整段可以删掉：不写就是**没接支付**，
# /api/billing/recharge 回 503，其余功能不受影响（和 billing 段默认启用相反，
# 支付默认关闭——没配商户密钥就启用，用户点「充值」那一刻才会失败）。
#
# 需要公网可达的回调地址：把 notify_url 指到 manager 的 /pay/epay/notify。
# 商户密钥建议只走环境变量 EPAY_KEY，不落配置文件。
#
# 接入后建议在网关后台把 /pay/epay/notify 加进白名单/回源规则（如果网关有的话），
# 并确认 notify_url 走的是直连而不是经过会丢掉 POST body 的缓存/代理。
#
payment:
  enabled: true                     # nil 或 false = 未接入
  api_base_url: "https://pay.example.com"  # 必须 https：查询/退款接口会带商户密钥
  pid: 1001                         # 商户 ID
  key: ""                           # 商户密钥（建议只走 EPAY_KEY 环境变量）
  notify_url: "https://api.example.com/pay/epay/notify"  # 异步通知，公网可达
  return_url: "https://www.example.com/pay/epay/return"  # 同步跳转（后端路由）
  channels: ["epay:alipay", "epay:wxpay"]  # 开放哪些渠道，留空 = 全部
  min_amount_micro: 1000000         # 单笔下限（微元，1000000 = ￥1）
  max_amount_micro: 10000000000     # 单笔上限（微元，10000000000 = ￥10000）
  order_ttl: "30m"                  # 订单有效期，超时后 sweeper 先查单再关单
  subject_prefix: "余额充值 "        # 订单标题前缀（收银台上显示）
  timeout: 30                       # 请求网关的超时秒数
  debug: false                      # 打印 SDK 请求日志（含签名），生产别开

# API Key（凭证）：让脚本、CI 与第三方集成用一把自助创建的 key 调 /api/*，
# 不必再借用人格化的 JWT（登录态 token 存 localStorage、无法按集成收窄权限）。
#
# 整段可以删掉：不写就是**关闭**（与 payment 段同一个约定）——带 ox_sk_ 前缀的请求
# 一律 401、控制台的凭证页显示「暂未开放」，与没有这个功能时完全一样。
#
# 开启后：
#   - 权限在创建时勾选（不可通配，缺权限回 403，并在响应里给出 required/granted）；
#   - 每把 key 一个独立的限流桶；撤销立即生效（每次校验都查库，没有缓存可以变旧）；
#   - 调用次数与最后使用时间是内存聚合、定时刷库的**非精确**计数，不能用来对账。
apikey:
  enabled: false                    # nil 或 false = 关闭；显式 true 才启用
  rate_limit:
    rps: 20                         # 每把 key 每秒补充的令牌数（0 = 用默认值 20）
    burst: 40                       # 每把 key 的桶容量，即瞬时突发上限（0 = 默认 40）
  counter_flush: "30s"              # 调用次数 / 最后使用的刷库窗口
  max_per_account: 100              # 单个账号可持有的 key 上限
  admin_only: false                 # 灰度开关：true 时只有管理员能创建新 key
