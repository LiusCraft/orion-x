<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orion-X Voice Debugger</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0d0d14; font-family: 'Inter', system-ui, sans-serif; }

  /* Glass card */
  .glass {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
  }

  /* Input focus ring */
  .field {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: #f1f5f9;
    transition: border-color .15s;
  }
  .field:focus { outline: none; border-color: #6366f1; }
  .field:disabled { opacity: .4; cursor: not-allowed; }

  /* Mic button */
  .mic-btn {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: all .2s;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
  }
  .mic-btn:hover:not(:disabled) {
    background: rgba(99,102,241,0.15);
    border-color: rgba(99,102,241,0.5);
    transform: scale(1.04);
  }
  .mic-btn:disabled { opacity: .35; cursor: not-allowed; }
  .mic-btn.recording {
    background: rgba(244,63,94,0.15);
    border-color: rgba(244,63,94,0.6);
    animation: mic-pulse 1.4s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244,63,94,.4); }
    50%       { box-shadow: 0 0 0 20px rgba(244,63,94,0); }
  }

  /* Volume ring */
  .vol-ring {
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 2px solid rgba(34,197,94,0);
    transition: border-color .08s, box-shadow .08s;
  }
  .recording .vol-ring {
    border-color: rgba(34,197,94,.35);
  }

  /* Agent emotion badge */
  .emotion-badge {
    position: absolute; top: -8px; right: -8px;
    font-size: 1.75rem; line-height: 1;
    pointer-events: none;
    transition: opacity .3s;
  }
  .emotion-badge.hidden { opacity: 0; }
  @keyframes emotion-pop {
    0%   { transform: scale(.4); opacity: 0; }
    65%  { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); }
  }
  .emotion-badge.pop { animation: emotion-pop .35s cubic-bezier(.34,1.56,.64,1) forwards; }

  /* Status dot */
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444;
    transition: background .3s;
  }
  .status-dot.connected { background: #22c55e; animation: dot-blink 2.5s ease-in-out infinite; }
  @keyframes dot-blink {
    0%,100% { opacity:1; } 50% { opacity:.4; }
  }

  /* Chat bubble */
  .bubble-stt {
    background: rgba(255,255,255,0.06);
    border-radius: 12px 12px 12px 2px;
  }
  .bubble-tts {
    background: rgba(99,102,241,0.15);
    border-radius: 12px 12px 2px 12px;
  }

  /* Log area */
  .log-entry { padding: 2px 0; }
  .log-sent     { color: #818cf8; }
  .log-received { color: #4ade80; }
  .log-error    { color: #f87171; }
  .log-info     { color: #94a3b8; }
  .log-debug    { color: #475569; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* Primary button */
  .btn-primary {
    background: #6366f1;
    color: white;
    border-radius: 8px;
    font-weight: 600;
    transition: all .15s;
  }
  .btn-primary:hover:not(:disabled) { background: #4f46e5; }
  .btn-primary:disabled { background: rgba(255,255,255,0.07); color: rgba(255,255,255,.25); cursor: not-allowed; }

  .btn-danger {
    background: rgba(244,63,94,0.12);
    color: #f87171;
    border: 1px solid rgba(244,63,94,0.25);
    border-radius: 8px;
    font-weight: 600;
    transition: all .15s;
  }
  .btn-danger:hover:not(:disabled) { background: rgba(244,63,94,0.22); }
  .btn-danger:disabled { opacity:.3; cursor: not-allowed; }

  .btn-ghost {
    background: rgba(255,255,255,0.05);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    font-weight: 600;
    transition: all .15s;
  }
  .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.09); color: #f1f5f9; }
  .btn-ghost:disabled { opacity:.3; cursor: not-allowed; }

  /* PTT (push-to-talk) button pressed state */
  .ptt-btn.pressing,
  .ptt-btn:active:not(:disabled) {
    background: rgba(239,68,68,0.15);
    border-color: rgba(239,68,68,0.35);
    color: #ef4444;
  }

  /* log section toggle */
  details summary { list-style: none; cursor: pointer; }
  details summary::-webkit-details-marker { display: none; }
  details[open] .chevron { transform: rotate(180deg); }
  .chevron { transition: transform .2s; }
</style>
</head>
<body class="min-h-screen text-slate-100">

<!-- Top nav -->
<header class="border-b border-white/[0.06] px-6 py-4 flex items-center gap-4">
  <div class="flex items-center gap-2">
    <div class="w-7 h-7 rounded-lg bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-sm">◎</div>
    <span class="font-semibold text-slate-100 tracking-tight">Orion-X</span>
    <span class="text-slate-600 text-sm font-normal">/ Voice Debugger</span>
  </div>
  <div class="ml-auto flex items-center gap-3">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusLabel" class="text-sm text-slate-500">Disconnected</span>
  </div>
</header>

<!-- Main -->
<div class="max-w-7xl mx-auto px-6 py-6 flex gap-5" style="height:calc(100vh - 61px)">

  <!-- Left sidebar: connection config -->
  <aside class="w-64 shrink-0 flex flex-col gap-4">
    <div class="glass rounded-xl p-5 flex flex-col gap-3">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-1">Connection</p>

      <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-400">Server URL</label>
        <input id="serverUrl" type="text" value="ws://localhost:8080/ws"
          class="field text-sm rounded-lg px-3 py-2 w-full" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-400">Device ID</label>
        <input id="deviceId" type="text" value="web-debug-client"
          class="field text-sm rounded-lg px-3 py-2 w-full" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-400">Mode</label>
        <select id="mode" class="field text-sm rounded-lg px-3 py-2 w-full cursor-pointer">
          <option value="auto">Auto (Server VAD)</option>
          <option value="manual">Manual (Client)</option>
        </select>
      </div>

      <button id="connectBtn" class="btn-primary px-4 py-2 text-sm mt-1">Connect</button>
      <button id="disconnectBtn" disabled class="btn-danger px-4 py-2 text-sm">Disconnect</button>
    </div>

    <!-- Session info -->
    <div class="glass rounded-xl p-4">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3">Session</p>
      <div id="connectionStatus" class="text-sm text-slate-500">—</div>
      <div id="sessionId" class="text-xs text-slate-600 mt-1 break-all font-mono"></div>
    </div>

    <!-- Manual mode -->
    <div id="manualControls" class="glass rounded-xl p-4 opacity-40 pointer-events-none">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3">Manual Turn</p>
      <div class="flex gap-2">
        <button id="listenStartBtn" disabled class="btn-ghost flex-1 px-3 py-2 text-xs">▶ Start</button>
        <button id="listenStopBtn"  disabled class="btn-ghost flex-1 px-3 py-2 text-xs">■ Stop</button>
      </div>
    </div>
  </aside>

  <!-- Center: mic + conversation -->
  <main class="flex-1 flex flex-col gap-4 min-w-0">

    <!-- Mic area -->
    <div class="glass rounded-xl p-6 flex flex-col items-center gap-4">
      <div class="relative">
        <div class="mic-btn">
          <div class="vol-ring" id="volRing"></div>
          <span id="micIcon"></span>
        </div>
        <!-- Agent emotion badge: updated by llm messages from the server -->
        <div id="emotionBadge" class="emotion-badge hidden" aria-live="polite" aria-label="Agent emotion"></div>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <div id="micDot" class="w-2 h-2 rounded-full bg-slate-600"></div>
        <span id="micStatusText" class="text-slate-500">Connect first</span>
      </div>
      <!-- Volume bar -->
      <div class="w-48 h-1 bg-white/[0.06] rounded-full overflow-hidden">
        <div id="micLevel" class="h-full bg-green-400 rounded-full transition-all duration-75" style="width:0%"></div>
      </div>
    </div>

    <!-- Conversation -->
    <div class="glass rounded-xl flex-1 flex flex-col min-h-0">
      <div class="px-5 py-3 border-b border-white/[0.05] flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Conversation</span>
        <button id="clearConvBtn" class="text-xs text-slate-600 hover:text-slate-400 transition">Clear</button>
      </div>
      <div id="conversation" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
        <p class="conv-empty text-sm text-slate-600 text-center mt-8">No messages yet</p>
      </div>
    </div>

    <!-- Text input -->
    <div class="glass rounded-xl p-4 flex gap-3 items-center">
      <input id="textInput" type="text" disabled
        placeholder="Type and press Enter to inject text turn…"
        class="field flex-1 text-sm rounded-lg px-3 py-2" />
      <button id="sendTextBtn" disabled class="btn-primary px-4 py-2 text-sm shrink-0">Send</button>
      <button id="abortBtn" disabled class="btn-danger px-3 py-2 text-sm shrink-0">Abort</button>
      <button id="pttBtn" disabled
        class="ptt-btn btn-ghost px-3 py-2 text-sm shrink-0 hidden select-none"
        title="按住说话，松开发送">🎙️ 按住说话</button>
    </div>
  </main>

  <!-- Right sidebar: raw + log controls -->
  <aside class="w-56 shrink-0 flex flex-col gap-4">
    <div class="glass rounded-xl p-4 flex flex-col gap-3">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-1">Raw Message</p>
      <textarea id="rawMessage" disabled rows="4"
        placeholder='{"type":"listen","state":"start"}'
        class="field text-xs rounded-lg px-3 py-2 w-full font-mono resize-none"></textarea>
      <button id="sendRawBtn" disabled class="btn-ghost px-4 py-2 text-xs">Send JSON</button>
    </div>

    <!-- Quick snippets -->
    <div class="glass rounded-xl p-4 flex flex-col gap-2">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-1">Snippets</p>
      <button data-snippet='{"type":"listen","state":"start"}' class="snippet-btn btn-ghost px-3 py-1.5 text-xs text-left">listen start</button>
      <button data-snippet='{"type":"listen","state":"stop"}'  class="snippet-btn btn-ghost px-3 py-1.5 text-xs text-left">listen stop</button>
      <button data-snippet='{"type":"abort"}'                 class="snippet-btn btn-ghost px-3 py-1.5 text-xs text-left">abort</button>
    </div>
  </aside>
</div>

<!-- Debug log (collapsible) -->
<details class="border-t border-white/[0.06]" id="logSection">
  <summary class="px-6 py-3 flex items-center gap-2 text-xs text-slate-500 hover:text-slate-300 transition select-none">
    <svg class="chevron w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
    </svg>
    Debug Log
    <label class="ml-auto flex items-center gap-1.5 cursor-pointer" onclick="event.stopPropagation()">
      <input type="checkbox" id="autoscrollLog" checked class="rounded">
      <span>Auto-scroll</span>
    </label>
    <button id="clearLogBtn" class="ml-2 hover:text-red-400 transition" onclick="event.stopPropagation()">Clear</button>
  </summary>
  <div id="messageLog"
    class="h-44 overflow-y-auto px-6 py-3 font-mono text-xs space-y-0.5 bg-black/30">
    <div class="log-info">Ready.</div>
  </div>
</details>

<!-- Mode selection modal: must be before <script> so DOM is ready when JS runs -->
<div id="modeModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 hidden">
  <div class="glass rounded-2xl p-8 w-72 flex flex-col gap-3 text-center">
    <p class="font-semibold text-slate-100 text-base mb-1">选择连接方式</p>
    <button id="connectPhoneBtn" class="btn-primary py-3 flex items-center justify-center gap-2 text-base">
      <span>📞</span><span>拨打电话</span>
    </button>
    <button id="connectVoiceBtn" class="btn-ghost py-3 flex items-center justify-center gap-2 text-base">
      <span>🎤</span><span>语音模式</span>
    </button>
    <button id="cancelConnectBtn" class="text-xs text-slate-600 hover:text-slate-400 transition mt-1">取消</button>
  </div>
</div>

<script>
// ── state ────────────────────────────────────────────────────────────────────
const STATE = {
  ws: null, connected: false, sessionId: null, mode: 'auto',
  audioCtx: null, micStream: null, processor: null, recording: false,
  // TTS playback
  playCtx: null, nextPlayTime: 0, ttsSampleRate: 16000,
  // Agent emotion (updated by llm messages)
  currentEmotion: '',
};

// ── element refs ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const E = {
  serverUrl: $('serverUrl'), deviceId: $('deviceId'), mode: $('mode'),
  connectBtn: $('connectBtn'), disconnectBtn: $('disconnectBtn'),
  statusDot: $('statusDot'), statusLabel: $('statusLabel'),
  connectionStatus: $('connectionStatus'), sessionId: $('sessionId'),
  manualControls: $('manualControls'),
  listenStartBtn: $('listenStartBtn'), listenStopBtn: $('listenStopBtn'),
  textInput: $('textInput'), sendTextBtn: $('sendTextBtn'),
  abortBtn: $('abortBtn'),
  rawMessage: $('rawMessage'), sendRawBtn: $('sendRawBtn'),
  messageLog: $('messageLog'), clearLogBtn: $('clearLogBtn'),
  autoscrollLog: $('autoscrollLog'),
  conversation: $('conversation'), clearConvBtn: $('clearConvBtn'),
  micDot: $('micDot'), micStatusText: $('micStatusText'),
  micLevel: $('micLevel'), volRing: $('volRing'), micIcon: $('micIcon'),
  emotionBadge: $('emotionBadge'),
  pttBtn: $('pttBtn'),
  modeModal: $('modeModal'),
  connectPhoneBtn: $('connectPhoneBtn'), connectVoiceBtn: $('connectVoiceBtn'),
  cancelConnectBtn: $('cancelConnectBtn'),
};

// ── logging ──────────────────────────────────────────────────────────────────
function dbg(type, msg, data = null) {
  const ts = new Date().toLocaleTimeString('en', { hour12: false });
  const el = document.createElement('div');
  el.className = `log-entry log-${type}`;
  el.textContent = `${ts}  ${type.padEnd(8)}${msg}${data ? '  ' + JSON.stringify(data) : ''}`;
  if (E.messageLog.firstChild?.textContent === 'Ready.') E.messageLog.innerHTML = '';
  E.messageLog.appendChild(el);
  if (E.autoscrollLog.checked) E.messageLog.scrollTop = E.messageLog.scrollHeight;
}

// ── conversation ─────────────────────────────────────────────────────────────
function addConvMsg(role, text, sub = '') {
  E.conversation.querySelector('.conv-empty')?.remove();
  const wrap = document.createElement('div');
  wrap.className = role === 'stt' ? 'flex justify-start' : 'flex justify-end';
  const bubble = document.createElement('div');
  bubble.className = `${role === 'stt' ? 'bubble-stt' : 'bubble-tts'} max-w-xs px-4 py-2.5`;
  bubble.innerHTML = `<p class="text-sm text-slate-100 leading-snug">${escapeHtml(text)}</p>` +
    (sub ? `<p class="text-xs text-slate-500 mt-1">${escapeHtml(sub)}</p>` : '');
  wrap.appendChild(bubble);
  E.conversation.appendChild(wrap);
  E.conversation.scrollTop = E.conversation.scrollHeight;
}

function escapeHtml(t) {
  const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
}

// ── agent emotion ─────────────────────────────────────────────────────────────
function setEmotion(emoji) {
  if (!emoji || emoji === STATE.currentEmotion) return;
  STATE.currentEmotion = emoji;
  if (STATE.mode === 'auto') {
    E.micIcon.textContent = emoji;
  } else {
    E.emotionBadge.textContent = emoji;
    E.emotionBadge.classList.remove('hidden', 'pop');
    void E.emotionBadge.offsetWidth;
    E.emotionBadge.classList.add('pop');
  }
}

function clearEmotion() {
  STATE.currentEmotion = '';
  if (STATE.mode === 'auto' && STATE.connected) {
    E.micIcon.textContent = '😊';
  } else {
    E.micIcon.textContent = '';
  }
  E.emotionBadge.classList.add('hidden');
  E.emotionBadge.classList.remove('pop');
}

// ── connection status UI ─────────────────────────────────────────────────────
function setConnected(v) {
  STATE.connected = v;
  E.statusDot.className = 'status-dot' + (v ? ' connected' : '');
  E.statusLabel.textContent = v ? `Session ${STATE.sessionId?.slice(0,8)}…` : 'Disconnected';
  E.connectionStatus.textContent = v ? STATE.sessionId : '—';
  E.sessionId.textContent = '';

  const btns = [E.listenStartBtn, E.listenStopBtn, E.textInput,
                E.sendTextBtn, E.abortBtn, E.rawMessage, E.sendRawBtn];
  btns.forEach(b => b.disabled = !v);
  E.connectBtn.disabled = v;
  E.disconnectBtn.disabled = !v;

  document.querySelectorAll('.snippet-btn').forEach(b => b.disabled = !v);

  if (STATE.mode === 'manual') {
    E.manualControls.classList.remove('opacity-40', 'pointer-events-none');
    E.pttBtn.classList.remove('hidden');
    E.pttBtn.disabled = !v;
    E.micIcon.textContent = '';
  } else {
    E.manualControls.classList.add('opacity-40', 'pointer-events-none');
    E.pttBtn.classList.add('hidden');
    if (v) {
      E.micIcon.textContent = STATE.currentEmotion || '😊';
      startRecording();
    } else {
      E.micIcon.textContent = '';
      stopRecording();
    }
  }
  if (!v) clearEmotion();
}

// ── connect / disconnect ──────────────────────────────────────────────────────
function connect() {
  if (STATE.ws) STATE.ws.close();
  const url = E.serverUrl.value.trim();
  STATE.mode = E.mode.value;
  dbg('info', `connecting → ${url}`);
  STATE.ws = new WebSocket(url);
  STATE.ws.binaryType = 'arraybuffer';

  STATE.ws.onopen = () => {
    const hello = {
      type: 'hello',
      device_id: E.deviceId.value || 'web-debug',
      mode: STATE.mode,
      audio_params: { format: 'pcm', sample_rate: 16000, channels: 1, bits_per_sample: 16 },
    };
    STATE.ws.send(JSON.stringify(hello));
    dbg('sent', 'hello', hello);
  };

  STATE.ws.onmessage = ({ data }) => {
    if (typeof data !== 'string') { playPCM(data); return; }
    let msg;
    try { msg = JSON.parse(data); } catch { dbg('error', 'bad JSON'); return; }
    dbg('received', msg.type, msg);
    if (msg.type === 'hello') {
      STATE.sessionId = msg.session_id;
      STATE.ttsSampleRate = msg.audio_params?.sample_rate || 16000;
      STATE.playCtx = new AudioContext({ sampleRate: STATE.ttsSampleRate });
      STATE.nextPlayTime = 0;
      setConnected(true);
    } else if (msg.type === 'stt' && msg.text) {
      addConvMsg('stt', msg.text, 'you (ASR)');
    } else if (msg.type === 'tts' && msg.text && msg.state !== 'sentence_end') {
      addConvMsg('tts', msg.text, `TTS · ${msg.state}`);
    } else if (msg.type === 'llm') {
      if (msg.emotion) setEmotion(msg.emotion);
    }
  };

  STATE.ws.onerror = () => dbg('error', 'websocket error');
  STATE.ws.onclose = () => {
    stopRecording();
    STATE.playCtx?.close(); STATE.playCtx = null; STATE.nextPlayTime = 0;
    setConnected(false); dbg('info', 'closed');
  };
}

function disconnect() { stopRecording(); STATE.ws?.close(); }

// ── send helper ──────────────────────────────────────────────────────────────
function send(msg) {
  if (!STATE.ws || STATE.ws.readyState !== WebSocket.OPEN) { dbg('error', 'not connected'); return; }
  if (STATE.sessionId) msg.session_id = STATE.sessionId;
  STATE.ws.send(JSON.stringify(msg));
  dbg('sent', msg.type, msg);
}

// ── TTS playback ──────────────────────────────────────────────────────────────
function playPCM(arrayBuffer) {
  if (!STATE.playCtx) return;
  const i16 = new Int16Array(arrayBuffer);
  if (i16.length === 0) return;
  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768.0;
  const buf = STATE.playCtx.createBuffer(1, f32.length, STATE.ttsSampleRate);
  buf.copyToChannel(f32, 0);
  const src = STATE.playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(STATE.playCtx.destination);
  const now = STATE.playCtx.currentTime;
  const start = Math.max(now, STATE.nextPlayTime);
  src.start(start);
  STATE.nextPlayTime = start + buf.duration;
  dbg('debug', `pcm ${i16.length}s @${STATE.ttsSampleRate}Hz → play t=${start.toFixed(3)}`);
}

// ── mic recording ─────────────────────────────────────────────────────────────
function setMicRecording(v) {
  STATE.recording = v;
  E.micDot.className = `w-2 h-2 rounded-full ${v ? 'bg-red-500 animate-pulse' : 'bg-slate-600'}`;
  E.micStatusText.textContent = v ? 'Recording…' : 'Idle';
  if (!v) { E.micLevel.style.width = '0%'; E.volRing.style.boxShadow = ''; }
}

function stopRecording() {
  STATE.processor?.disconnect(); STATE.processor = null;
  STATE.micStream?.getTracks().forEach(t => t.stop()); STATE.micStream = null;
  STATE.audioCtx?.close(); STATE.audioCtx = null;
  setMicRecording(false);
  dbg('info', 'mic stopped');
}

async function startRecording() {
  if (STATE.recording) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
    STATE.micStream = stream;
    const ctx = new AudioContext({ sampleRate: 16000 });
    STATE.audioCtx = ctx;
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    STATE.processor = proc;

    proc.onaudioprocess = ({ inputBuffer }) => {
      if (!STATE.recording || STATE.ws?.readyState !== WebSocket.OPEN) return;
      const f32 = inputBuffer.getChannelData(0);
      // RMS meter
      let sq = 0; for (let i = 0; i < f32.length; i++) sq += f32[i] * f32[i];
      const rms = Math.sqrt(sq / f32.length);
      const pct = Math.min(rms * 400, 100);
      E.micLevel.style.width = `${pct}%`;
      const glow = Math.round(pct * 0.6);
      E.volRing.style.boxShadow = pct > 5 ? `0 0 ${glow}px rgba(34,197,94,${(pct/100)*0.6})` : '';
      // float32 → int16LE
      const i16 = new Int16Array(f32.length);
      for (let i = 0; i < f32.length; i++) {
        const s = Math.max(-1, Math.min(1, f32[i]));
        i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      STATE.ws.send(i16.buffer);
    };

    src.connect(proc); proc.connect(ctx.destination);
    setMicRecording(true);
    dbg('info', `mic started @ ${ctx.sampleRate}Hz`);
  } catch (err) {
    dbg('error', `mic: ${err.message}`);
  }
}

// ── event listeners ──────────────────────────────────────────────────────────
// Connect 按钮打开模式选择弹窗
E.connectBtn.addEventListener('click', () => E.modeModal.classList.remove('hidden'));
E.cancelConnectBtn.addEventListener('click', () => E.modeModal.classList.add('hidden'));
E.connectPhoneBtn.addEventListener('click', () => {
  E.mode.value = 'auto';
  E.modeModal.classList.add('hidden');
  connect();
});
E.connectVoiceBtn.addEventListener('click', () => {
  E.mode.value = 'manual';
  E.modeModal.classList.add('hidden');
  connect();
});
// 点击 modal 遮罩层关闭
E.modeModal.addEventListener('click', e => { if (e.target === E.modeModal) E.modeModal.classList.add('hidden'); });

E.disconnectBtn.addEventListener('click', disconnect);

// PTT (push-to-talk) — 按住说话，松开停止，同时发 listen start/stop
function startPTT(e) {
  e.preventDefault();
  if (!STATE.connected || STATE.recording) return;
  E.pttBtn.classList.add('pressing');
  E.pttBtn.textContent = '🔴 说话中…';
  send({ type: 'listen', state: 'start' });
  startRecording();
}
function stopPTT(e) {
  e.preventDefault();
  if (!STATE.recording) return;
  E.pttBtn.classList.remove('pressing');
  E.pttBtn.textContent = '🎙️ 按住说话';
  send({ type: 'listen', state: 'stop' });
  stopRecording();
}
E.pttBtn.addEventListener('mousedown', startPTT);
E.pttBtn.addEventListener('mouseup',   stopPTT);
E.pttBtn.addEventListener('mouseleave', stopPTT);
E.pttBtn.addEventListener('touchstart', startPTT, { passive: false });
E.pttBtn.addEventListener('touchend',  stopPTT);
E.pttBtn.addEventListener('touchcancel', stopPTT);

E.listenStartBtn.addEventListener('click', () => send({ type: 'listen', state: 'start' }));
E.listenStopBtn.addEventListener('click',  () => send({ type: 'listen', state: 'stop'  }));
E.abortBtn.addEventListener('click',       () => send({ type: 'abort' }));

E.sendTextBtn.addEventListener('click', () => {
  const t = E.textInput.value.trim();
  if (!t) return;
  send({ type: 'listen', state: 'detect', text: t });
  E.textInput.value = '';
});
E.textInput.addEventListener('keydown', e => e.key === 'Enter' && E.sendTextBtn.click());

E.sendRawBtn.addEventListener('click', () => {
  try { send(JSON.parse(E.rawMessage.value)); } catch { dbg('error', 'invalid JSON'); }
});

document.querySelectorAll('.snippet-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    E.rawMessage.value = btn.dataset.snippet;
    try { send(JSON.parse(btn.dataset.snippet)); } catch {}
  });
});

E.clearLogBtn.addEventListener('click', () => { E.messageLog.innerHTML = ''; });
E.clearConvBtn.addEventListener('click', () => {
  E.conversation.innerHTML = '<p class="text-sm text-slate-600 text-center mt-8">No messages yet</p>';
});

E.mode.addEventListener('change', () => {
  if (STATE.connected) dbg('info', 'mode change needs reconnect');
});

// init
setConnected(false);
E.micStatusText.textContent = 'Connect first';
</script>
</body>
</html>
